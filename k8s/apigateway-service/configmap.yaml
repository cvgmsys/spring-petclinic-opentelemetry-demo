apiVersion: v1
kind: ConfigMap
metadata:
  name: api-gateway-config
  namespace: spring-petclinic
  labels:
    app: api-gateway
data:
  application.yml: |
    zuul:
      prefix: /api
      ignoredServices: '*'
      routes:
        vets-service:
          path: /vet/**
          url: http://vets-service:8080
        visits-service:
          path: /visit/**
          url: http://visits-service:8080
        customers-service:
          path: /customer/**
          url: http://customers-service:8080

    server:
      port: 8080
      shutdown: graceful
      compression:
        enabled: true
        mime-types: application/json,text/css,application/javascript
        min-response-size: 2048

    spring:
      messages:
        basename: messages/messages

    management:
      security:
        enabled: false
      endpoints:
        web:
          exposure:
            include: "*"
      endpoint:
        health:
          show-details: always
    
    logging:
      level:
        org:
          springframework: INFO

    ---
    spring:
      config:
        activate:
          on-profile: chaos-monkey      

    management:
      endpoint:
        chaosmonkey:
          enabled: true
          
    chaos:
      monkey:
        enabled: true
        watcher:
          component: false
          controller: false
          repository: false
          rest-controller: false
          service: false