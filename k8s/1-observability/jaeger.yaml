apiVersion: v1
kind: ConfigMap
metadata:
  name: jaeger-ui-config
  namespace: observability
data:
  ui.json: |-
    {
      "monitor": {
        "menuEnabled": true
      }
    }
---
apiVersion: opentelemetry.io/v1beta1
kind: OpenTelemetryCollector
metadata:
  name: jaeger-backend
  namespace: observability
spec:
  image: jaegertracing/jaeger:2.17.0
  ports:
    - name: jaeger
      port: 16686
  volumes:
    - name: ui-config-volume
      configMap:
        name: jaeger-ui-config
  volumeMounts:
    - name: ui-config-volume
      mountPath: /etc/jaeger
  config:
    service:
      extensions: [jaeger_storage, jaeger_query]
      pipelines:
        traces:
          receivers: [otlp]
          exporters: [jaeger_storage_exporter]
    
    extensions:
      jaeger_storage:
        backends:
          opensearch_storage: &opensearch_config
            opensearch:
              server_urls: 
                - "https://admin:DemoPass123!@opensearch-cluster-master.observability.svc.cluster.local:9200"
              tls:
                insecure_skip_verify: true
        metric_backends:
          opensearch_storage: *opensearch_config
          
      jaeger_query:
        storage:
          traces: opensearch_storage
          metrics: opensearch_storage
        ui:
          config_file: /etc/jaeger/ui.json
            
    receivers:
      otlp:
        protocols:
          grpc:
            endpoint: 0.0.0.0:4317
          http:
            endpoint: 0.0.0.0:4318
            
    exporters:
      jaeger_storage_exporter:
        trace_storage: opensearch_storage
---
apiVersion: v1
kind: Service
metadata:
  name: jaeger-ui-nodeport
  namespace: observability
spec:
  type: NodePort
  selector:
    app.kubernetes.io/name: jaeger-backend-collector
  ports:
    - name: jaeger-ui
      port: 16686
      targetPort: 16686
      nodePort: 30686